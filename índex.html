<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linha do Tempo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TELA INICIAL -->
  <div id="start-screen" class="start-screen">
    <div class="start-content">
      <h1>Feliz Aniversário! 🎉💜</h1>
      <p>Que este dia seja cheio de amor, alegria e momentos inesquecíveis.</p>
      <button id="start-btn">Iniciar ✨</button>
    </div>
  </div>

  <div class="clouds">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4"></div>
  </div>

  <header class="top hidden-section">
    <h1>Linha do Tempo</h1>
    <p>Momentos especiais reunidos com carinho! 💜</p>
  </header>

  <section class="timeline hidden-section">

    <div class="timeline-item hidden">
      <div class="marker"></div>
      <div class="content glass">
        <img src="img/img1.png" alt="">
      </div>
    </div>

    <div class="timeline-item hidden">
      <div class="marker"></div>
      <div class="content glass">
        <img src="img/img2.jpeg" alt="">
      </div>
    </div>

    <div class="timeline-item hidden">
      <div class="marker"></div>
      <div class="content glass">
        <img src="img/img3.jpeg" alt="">
      </div>
    </div>

    <div class="timeline-item hidden">
      <div class="marker"></div>
      <div class="content glass">
        <img src="img/img10.jpeg" alt="">
      </div>
    </div>

    <div class="timeline-item hidden">
      <div class="marker"></div>
      <div class="content glass">
        <img src="img/img11.jpeg" alt="">
      </div>
    </div>


    <div class="timeline-item hidden">
      <div class="marker"></div>
      <div class="content glass">
        <img src="img/img12.jpeg" alt="">
      </div>
    </div>

    <div class="timeline-item hidden">
      <div class="marker"></div>
      <div class="content glass">
        <img src="img/img4.jpeg" alt="">
      </div>
    </div>


    <div class="timeline-item hidden">
      <div class="marker"></div>
      <div class="content glass">
        <img src="img/img5.jpeg" alt="">
      </div>
    </div>


    <div class="timeline-item hidden">
      <div class="marker"></div>
      <div class="content glass">
        <img src="img/img6.jpeg" alt="">
      </div>
    </div>

    <div class="timeline-item hidden">
      <div class="marker"></div>
      <div class="content glass">
        <img src="img/img7.jpeg" alt="">
      </div>
    </div>


    <div class="timeline-item hidden">
      <div class="marker"></div>
      <div class="content glass">
        <img src="img/img8.jpeg" alt="">
      </div>
    </div>


    <div class="timeline-item hidden">
      <div class="marker"></div>
      <div class="content glass">
        <img src="img/img9.jpeg" alt="">
      </div>
    </div>

    
    <div class="timeline-item hidden">
      <div class="marker"></div>
      <div class="content glass">
         <div class="video-container">
          <iframe 
            src="https://www.youtube.com/embed/8uFeHbs8X0w"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>
      </div>
    </div>

  </section>

  <div id="heart-rain"></div>

  <audio id="background-music" loop>
    <source src="video/trilha_sonora.mp3" type="audio/mp3">
  </audio>
  <script src="script.js"></script>
</body>


</html>
